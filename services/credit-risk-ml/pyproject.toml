[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Metadados principais do projeto e dependências de produção
[project]
name = "credit-risk-ml"
version = "0.1.0"
description = "Serviço de Machine Learning para predição de risco de crédito"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hugo Santos", email = "hg.oliveira2ds@gmail.com" }
]

# Dependências de Produção (Obrigatórias para rodar a API e o Modelo)
dependencies = [
    # Framework Web e Servidor
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.7",

    # Data Science e Machine Learning
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",

    # Utilitários e Infraestrutura
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    
    # MLOps e Versionamento de Dados (Para baixar modelos/dados)
    "dvc>=3.40.0"
]

# Dependências Opcionais (Desenvolvimento, Testes e CI/CD)
[project.optional-dependencies]
dev = [
    # Testes
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",  # Necessário para o TestClient do FastAPI

    # Qualidade de Código e Linting (Ruff substitui Black, Isort e Flake8)
    "ruff>=0.2.0",
    
    # Tipagem Estática
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "pandas-stubs>=2.1.0", # Stubs de tipagem para Pandas
    
    # Notebooks 
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

# Configuração do Ruff (Linter e Formatter ultra-rápido)
[tool.ruff]
line-length = 88
target-version = "py311"

# Regras de Linting do Ruff
[tool.ruff.lint]
# E: pycodestyle errors
# W: pycodestyle warnings
# F: pyflakes
# I: isort (ordenação de imports)
# B: flake8-bugbear (bugs comuns)
# UP: pyupgrade (modernização de sintaxe)
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []

# Configuração do Isort dentro do Ruff
[tool.ruff.lint.isort]
known-first-party = ["src"]

# Configuração do Pytest
[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = [
    "src"
]

addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]

# Configuração do Coverage (Cobertura de Testes)
[tool.coverage.run]
omit = [
    "*/__init__.py",
    "*/tests/*",
    "src/config.py" 
]

# Configuração do Mypy (Checagem estática de tipos)
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true